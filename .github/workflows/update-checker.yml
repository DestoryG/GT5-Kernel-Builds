name: Update Checker

env:
  REPO_URL: https://github.com/SukiSU-Ultra/SukiSU-Ultra
  REPO_BRANCH: susfs-main

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Get Commit Hash
      id: getHash
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
        echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@v3
      with:
        path: .commitHash
        key: commitHash_${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.getHash.outputs.commitHash }} | tee .commitHash

    - name: Trigger Build Workflow
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        curl -X POST https://api.github.com/repos/${{ github.repository }}/actions/workflows/build_test.yml/dispatches \
        -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
        -d '{"ref": "${{ github.ref }}"}'
